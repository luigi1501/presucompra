name: presucompra
description: "Calculadora de presupuestos y lista de compras para el mercado venezolano."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado (State Management)
  provider: ^6.1.2

  # Base de datos local (SQLite) — Offline First
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

  # Generación de IDs únicos para artículos
  uuid: ^4.4.0

  # Formateo de números y fechas (moneda, miles, etc.)
  intl: ^0.19.0

  # Conexión HTTP para tasas del BCV en tiempo real
  http: ^1.2.0

  # Compartir contenido (WhatsApp, Telegram, etc.)
  share_plus: ^10.1.4
  url_launcher: ^6.3.0

  # Ícono de la app
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.jpeg"

